[project]
name = "vowels"
version = "0.1.0"
description = "Vowel formant analysis toolkit with Praat and Parselmouth"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.2.1",
    "fasttrackpy>=0.6.1",
    "ipykernel>=7.3.0",
    "numpy>=2.0",
    "plotly>=6.8.0",
    "polars>=1.41.2",
    "praat-parselmouth>=0.4.7",
    "typer>=0.12",
]

[project.scripts]
vowels = "vowels.cli:app"

[dependency-groups]
dev = [
    "complexipy>=6.2.0",
    "pyrefly>=1.1.1",
    "pytest>=8.0",
    "ruff>=0.15.18",
    "rust-just>=1.57.0",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[tool.ty.environment]
extra-paths = ["typings"]

[tool.pyright]
venvPath = "."
venv = ".venv"
stubPath = "typings"
extraPaths = ["typings"]
